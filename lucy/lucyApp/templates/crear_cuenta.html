{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Barra de navegación (vacía por ahora) -->
    <nav class="navbar"></nav>

    <div class="auth-container">
        <!-- Contenedor del formulario -->
        <div class="form-section">
            <h1 class="auth-titulo">Crea una cuenta</h1>

            <form class="crear-cuenta-form">
                <!-- Nombre -->
                <div class="form-group">
                    <input type="text" placeholder="Nombre" class="form-input" required>
                </div>

                <!-- Apellido -->
                <div class="form-group">
                    <input type="text" placeholder="Apellidos" class="form-input" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <input type="email" placeholder="Email" class="form-input" required>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <div class="password-input-container">
                        <input 
                            type="password" 
                            id="password-crear" 
                            placeholder="Contraseña" 
                            class="form-input" 
                            required
                        >
                        <button 
                            type="button" 
                            class="toggle-password-crear"
                            onclick="togglePasswordCrear()"
                        >
                            <i class="fas fa-eye" id="eye-icon-crear"></i>
                        </button>
                    </div>
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <div class="phone-input-group">
                        <input type="tel" placeholder="Teléfono (10 dígitos)" class="form-input phone-input" required>
                    </div>
                </div>

                <!-- Botón crear -->
                <button type="submit" class="btn-crear">
                    Crear
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Enlace para iniciar sesión -->
            <p class="auth-link-text">¿ya tienes cuenta? <a href="#" class="auth-link">Iniciar sesión</a></p>
        </div>
    </div>

    <!-- Footer (vacío por ahora) -->
    <footer class="footer"></footer>

    <script>
        function togglePasswordCrear() {
            const passwordInput = document.getElementById('password-crear');
            const eyeIcon = document.getElementById('eye-icon-crear');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
