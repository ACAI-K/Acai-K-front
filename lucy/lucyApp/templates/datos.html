{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduce tus datos - Acai-K</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="navbar"></div>

    <div class="datos-container">
        <!-- Left side - Form -->
        <div class="datos-form-section">
            <div class="form-header">
                <h1>Introduce tus datos</h1>
                <p class="form-subtitle">0 crea una cuenta</p>
            </div>

            <form class="datos-form">
                <div class="form-group">
                    <input type="text" placeholder="Nombre" class="form-input" required>
                </div>

                <div class="form-group">
                    <input type="text" placeholder="Apellidos" class="form-input" required>
                </div>

                <div class="form-group">
                    <input type="email" placeholder="Email" class="form-input" required>
                </div>

                <div class="form-group phone-row">
                    <select class="country-code" title="Código de país">
                        <option value="+1">+1</option>
                        <option value="+34">+34</option>
                        <option value="+52">+52</option>
                        <option value="+56">+56</option>
                        <option value="+57">+57</option>
                    </select>
                    <input type="tel" placeholder="Teléfono (10 dígitos)" class="form-input phone-input" maxlength="10" required>
                </div>
            </form>
        </div>

        <!-- Right side - Booking Summary -->
        <div class="datos-resumen-section">
            <div class="resumen-header">
                <h2>Reserva</h2>
            </div>

            <div class="resumen-items">
                <!-- Item ejemplo -->
                <div class="resumen-item">
                    <div class="item-image"></div>
                    <div class="item-details">
                        <h3>Cabañas "El Abuelo"</h3>
                        <p class="dates">Del 07 al 13 de agosto</p>
                        <p class="nights">7 noches</p>
                        <p class="guests">4 Adultos, 2 Niños</p>
                    </div>
                </div>

                <!-- Items list -->
                <div class="items-list">
                    <div class="list-item">
                        <span class="item-name">Cabañas Deluxe</span>
                        <span class="item-price">$1999.99 MXN</span>
                    </div>
                    <p class="per-night">por noche</p>

                    <div class="list-item">
                        <span class="item-name">Cabañas Junior</span>
                        <span class="item-price">$999.99 MXN</span>
                    </div>
                    <p class="per-night">por noche</p>
                </div>
            </div>

            <div class="resumen-total">
                <h3>Total</h3>
                <p class="total-price">$20999.86 MXN</p>
            </div>

            <button class="btn-pagar">
                Pagar
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div class="footer"></div>

    <script src="{% static 'js/datos.js' %}"></script>
</body>
</html>
